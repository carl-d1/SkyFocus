<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkyFocus</title>
  <meta name="description" content="SkyFocus: a flight-themed focus timer. Every focus session is a flight between real airports.">
  <meta name="color-scheme" content="dark light">
  <link id="favicon" rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Fonts (optional: system fonts are used when offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="css/base.css?v=5">
  <link rel="stylesheet" href="css/components.css?v=5">
  <link rel="stylesheet" href="css/views.css?v=5">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>
  <div class="app">
    <nav id="nav" class="nav" aria-label="Main"></nav>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <div id="announce" class="announce glass" aria-hidden="true"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="live" class="sr-only" aria-live="polite"></div>

  <!-- Data -->
  <script src="js/data-airports.js?v=5"></script>
  <script src="js/data-world.js?v=5"></script>
  <!-- Core -->
  <script src="js/storage.js?v=5"></script>
  <script src="js/geo.js?v=5"></script>
  <script src="js/state.js?v=5"></script>
  <script src="js/ui.js?v=5"></script>
  <script src="js/glass.js?v=5"></script>
  <script src="js/stats.js?v=5"></script>
  <script src="js/timer.js?v=5"></script>
  <!-- Maps -->
  <script src="js/map-fallback.js?v=5"></script>
  <script src="js/map-core.js?v=5"></script>
  <!-- Views -->
  <script src="js/onboarding.js?v=5"></script>
  <script src="js/booking.js?v=5"></script>
  <script src="js/boarding-pass.js?v=5"></script>
  <script src="js/inflight.js?v=5"></script>
  <script src="js/arrival.js?v=5"></script>
  <script src="js/logbook.js?v=5"></script>
  <script src="js/settings.js?v=5"></script>
  <script src="js/main.js?v=5"></script>
</body>
</html>
