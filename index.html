<html lang="en" data-theme="dark">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkyFocus</title>
  <meta name="description" content="SkyFocus: a flight-themed focus timer. Every focus session is a flight between real airports.">
  <meta name="color-scheme" content="dark light">
  <link id="favicon" rel="icon" type="image/svg+xml" href="assets/favicon.svg">
