<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SkyFocus">
  <defs>
    <linearGradient id="sfBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a47"/>
      <stop offset="1" stop-color="#0b1424"/>
    </linearGradient>
    <linearGradient id="sfTrail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f4a640" stop-opacity="0"/>
      <stop offset="1" stop-color="#f4a640"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#sfBg)"/>
  <!-- focus ring with an opening -->
