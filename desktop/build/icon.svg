<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- SkyFocus app icon: a glass tile, the focus ring in signal yellow with an opening,
       a contrail sweeping through it and the plane leaving through the gap. Original artwork. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232a3a"/>
      <stop offset=".55" stop-color="#121722"/>
      <stop offset="1" stop-color="#090b10"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset=".42" stop-color="#ffffff" stop-opacity=".03"/>
      <stop offset=".43" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".7" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".95"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffc400" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffc400" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#bg)"/>
  <circle cx="512" cy="532" r="360" fill="url(#glow)"/>
  <!-- focus ring with an opening toward the top right -->
  <path d="M 679.8 283.3 A 300 300 0 1 0 801.8 454.4" fill="none" stroke="#ffc400" stroke-width="58" stroke-linecap="round"/>
  <path d="M 679.8 283.3 A 300 300 0 1 0 801.8 454.4" fill="none" stroke="#fff3c4" stroke-opacity=".35" stroke-width="10" stroke-linecap="round" transform="translate(-6 -10)"/>
  <!-- contrail through the centre -->
  <path d="M 236 800 C 380 700 560 560 728 392" fill="none" stroke="url(#trail)" stroke-width="40" stroke-linecap="round"/>
  <circle cx="512" cy="532" r="34" fill="#ffc400"/>
  <!-- the plane, leaving through the gap -->
  <g transform="translate(782 343) rotate(42) scale(9.2) translate(-12 -12)">
    <path fill="#ffffff" d="M12 2c.9 0 1.5 1 1.5 2.2V9l7.5 4.5v2L13.5 13v4.6l2.5 1.9V21l-4-1.2L8 21v-1.5l2.5-1.9V13L3 15.5v-2L10.5 9V4.2C10.5 3 11.1 2 12 2z"/>
  </g>
  <!-- glass sheen and rim -->
  <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#sheen)"/>
  <rect x="66" y="66" width="892" height="892" rx="214" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="4"/>
</svg>
